version: "1.0"
name: n8n-build

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - TZ=Asia/Kolkata

    volumes:
      - n8n_data:/home/node/.n8n

  postgres:
    image: postgres:16
    container_name: postgres-n8n
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: adminer-n8n
    ports:
      - "8090:8080"

volumes:
  n8n_data:
  db_data: